<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickAIBook — 30s Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Poppins:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
/* Tokens pulled from the real quickaibook.com: indigo brand + logo
   accent, the teal-to-blue "Magic" mode gradient, and the dark navy
   used behind the Studio Workspace screens. */
:root {
  --ink:        #0B0B1E;
  --ink-soft:   #14142E;
  --paper:      #FFFFFF;
  --paper-dim:  #F1F0F7;
  --brand:      #4F46E5;
  --brand-deep: #3730A3;
  --brand-bright: #8B7FFF;
  --magic-a:    #2DD4BF;
  --magic-b:    #3B82F6;
  --gold:       #F5B942;
  --muted:      #6B7280;
  --font-display: 'Poppins', system-ui, sans-serif;
  --font-body: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #050509;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: var(--font-body);
}

#frame { width: 390px; max-width: 100vw; }

#stage {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 16;
  background: var(--paper);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
}

canvas#fx {
  position: absolute; inset: 0; width: 100%; height: 100%;
  z-index: 4; pointer-events: none;
}

#grain {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
  opacity: 0.05; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.scene {
  position: absolute; inset: 0; opacity: 0;
  transition: opacity .3s ease;
  overflow: hidden;
}
.scene.active { opacity: 1; }

.progressTrack {
  position: absolute; top: 14px; left: 14px; right: 14px; height: 4px;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 2px; overflow: hidden; z-index: 6;
}
.progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--magic-a), var(--brand-bright)); }

#playOverlay {
  position: absolute; inset: 0;
  background: rgba(11, 11, 30, 0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 10; cursor: pointer;
}
.playBtn {
  width: 66px; height: 66px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-bright), var(--brand));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 14px 34px rgba(79, 70, 229, 0.55);
  font-size: 24px; color: #fff;
}

button { font-family: inherit; cursor: pointer; border: none; }
#replayBtn {
  margin-top: 14px; width: 100%; border-radius: 24px; padding: 12px 20px;
  font-family: var(--font-display); font-size: 12px; font-weight: 800; letter-spacing: .04em;
  background: linear-gradient(135deg, var(--brand), var(--brand-deep)); color: #fff;
  box-shadow: 0 10px 26px rgba(79, 70, 229, 0.35);
}

/* ---------- ambient, always-on motion ---------- */
.breathe     { animation: breathe 2.4s ease-in-out infinite; }
.breatheSlow { animation: breathe 4s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-4px) scale(1.015); }
}

.drift  { animation: drift 5s ease-in-out infinite; }
@keyframes drift {
  0%, 100% { transform: translate(0, 0); }
  50%      { transform: translate(6px, -9px); }
}
.drift2 { animation: drift2 6.5s ease-in-out infinite; }
@keyframes drift2 {
  0%, 100% { transform: translate(0, 0); }
  50%      { transform: translate(-8px, 7px); }
}

.spin { animation: spin 16s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.pulseGlow { animation: pulseGlow 2s ease-in-out infinite; }
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 12px 26px rgba(79, 70, 229, 0.32); }
  50%      { box-shadow: 0 18px 42px rgba(139, 127, 255, 0.6); }
}

.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.wordfade {
  opacity: 0; transform: translateY(6px); display: inline-block;
  animation: wordfade .4s ease forwards;
}
@keyframes wordfade { to { opacity: 1; transform: translateY(0); } }

/* ---------- entrance transitions ---------- */
.enter-pop {
  transform: scale(0.6); opacity: 0;
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
}
.enter-pop.in { transform: scale(1); opacity: 1; }

.enter-rise {
  transform: translateY(10px); opacity: 0;
  transition: transform .4s ease, opacity .4s ease;
}
.enter-rise.in { transform: translateY(0); opacity: 1; }

/* Kinetic "snap" overshoot, layered on top of any entrance transition
   via a temporary class toggle (see snapPulse() in JS): every entrance
   gets a fast 110%->95%->100% punch instead of one smooth ease. An
   element that ALSO carries an infinite ambient loop needs both
   animations named in one declaration so the loop hands back control
   once the one-shot punch ends, instead of replacing it forever. */
@keyframes snapOvershoot {
  0%   { transform: scale(1.1); }
  55%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}
.snap-pop { animation: snapOvershoot .18s cubic-bezier(.34,1.56,.64,1); }
.breathe.snap-pop     { animation: breathe 2.4s ease-in-out infinite, snapOvershoot .18s cubic-bezier(.34,1.56,.64,1); }
.breatheSlow.snap-pop { animation: breathe 4s ease-in-out infinite, snapOvershoot .18s cubic-bezier(.34,1.56,.64,1); }
.drift.snap-pop        { animation: drift 5s ease-in-out infinite, snapOvershoot .18s cubic-bezier(.34,1.56,.64,1); }
.drift2.snap-pop       { animation: drift2 6.5s ease-in-out infinite, snapOvershoot .18s cubic-bezier(.34,1.56,.64,1); }
.pulseGlow.snap-pop    { animation: pulseGlow 2s ease-in-out infinite, snapOvershoot .18s cubic-bezier(.34,1.56,.64,1); }

#stage { will-change: transform, filter; }

@media (prefers-reduced-motion: reduce) {
  .breathe, .breatheSlow, .drift, .drift2, .spin, .pulseGlow, .blink { animation: none !important; }
}

/* ---------- Scene 1 : the spark ---------- */
#s1 { background: radial-gradient(120% 80% at 50% 30%, #1A1440, var(--ink) 65%); }
.s1shape {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, rgba(79,70,229,0.18), transparent 70%);
}
.s1shape-a { top: 6%; left: -14%; width: 160px; height: 160px; }
.s1shape-b { bottom: 14%; right: -12%; width: 190px; height: 190px; background: radial-gradient(circle, rgba(45,212,191,0.1), transparent 70%); }

.sparkWrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.sparkCore {
  width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle, #fff, var(--brand-bright) 55%, transparent 75%);
  opacity: 0; transform: scale(0.3);
  transition: opacity .4s ease, transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 0 50px rgba(139,127,255,0.7);
}
.sparkCore.in { opacity: 1; transform: scale(1); }
.sparkRing {
  position: absolute; width: 130px; height: 130px; border-radius: 50%;
  border: 1.5px solid rgba(139,127,255,0.35);
  opacity: 0; transform: scale(0.5);
  transition: opacity .5s ease, transform .5s ease;
}
.sparkRing.in { opacity: 1; transform: scale(1); }

.captionBottom {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 24px 36px;
  font-family: var(--font-display); line-height: 1.28;
}
.s1cap1 { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.55); margin-bottom: 6px; }
.s1cap2 { font-size: 22px; font-weight: 800; color: #fff; text-wrap: balance; }
.s1cap2 .accent { color: var(--brand-bright); font-style: italic; }

/* ---------- Scene 2 : the studio workspace ---------- */
#s2 {
  background:
    radial-gradient(90% 60% at 15% 0%, rgba(139,127,255,0.14), transparent 55%),
    radial-gradient(80% 60% at 100% 100%, rgba(45,212,191,0.1), transparent 55%),
    linear-gradient(165deg, #100E28, var(--ink));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.ring { position: absolute; top: -22%; left: -22%; width: 62%; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,255,255,0.08), transparent 40%); }

.studioBadge {
  font-family: var(--font-body); font-size: 10px; font-weight: 800; letter-spacing: .1em;
  color: #B6AEFF; text-transform: uppercase; position: relative; z-index: 2;
  opacity: 0; transition: opacity .3s ease;
}
.studioBadge.in { opacity: 1; }

.modeTabs {
  display: flex; gap: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 5px; position: relative; z-index: 2;
}
.modeTab {
  display: flex; align-items: center; gap: 5px; padding: 7px 13px; border-radius: 16px;
  font-family: var(--font-body); font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,0.55);
}
.modeTab-magic {
  color: #fff; opacity: 0; transform: scale(0.7);
  transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
  background: linear-gradient(135deg, var(--magic-a), var(--magic-b));
}
.modeTab-magic.in { opacity: 1; transform: scale(1); }

/* A real cropped screenshot of the actual Studio Workspace UI. */
.workShot {
  width: 86%; border-radius: 16px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 26px 54px rgba(0,0,0,0.45);
  transform: scale(0.6); opacity: 0;
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
}
.workShot.in { transform: scale(1); opacity: 1; }
.workShot img { display: block; width: 100%; height: auto; }

/* ---------- Scene 3 : the flipbook reveal ---------- */
#s3 { background: radial-gradient(90% 70% at 50% 30%, #201A4A, var(--ink) 70%); display: flex; align-items: center; justify-content: center; }
.ring2 { position: absolute; width: 145%; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(139,127,255,0.09), transparent 60%); }
.glowOrb {
  position: absolute; width: 42%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, var(--brand-bright), var(--brand) 60%, transparent 72%);
  opacity: 0; transform: scale(0.3); filter: blur(3px);
  transition: opacity .45s ease, transform .45s ease;
}
.glowOrb.in { opacity: 1; transform: scale(1); }

/* A real cropped screenshot of the actual flipbook viewer (page,
   AI Active badge, device row). Needs an explicit width on the
   wrapper: as a flex item it would otherwise shrink-wrap its content,
   and a percentage-width child contributes nothing to that shrink-wrap
   calculation, collapsing the whole card down to almost nothing. */
.flipShotStage { perspective: 800px; width: 100%; display: flex; justify-content: center; }
.flipShot {
  width: 88%; border-radius: 14px; overflow: hidden;
  box-shadow: 0 0 80px rgba(139,127,255,0.5), 0 30px 60px rgba(0,0,0,0.5);
  transform: scale(0) rotateY(0deg);
  transition: transform .6s cubic-bezier(.2,.9,.25,1.25);
}
.flipShot.in { transform: scale(1) rotateY(-6deg); }
.flipShot img { display: block; width: 100%; height: auto; }

.captionLight {
  position: absolute; bottom: 24px; left: 24px; right: 24px; text-align: center;
  color: #fff; font-family: var(--font-display); font-size: 16px; font-weight: 800; line-height: 1.4; text-wrap: balance;
  opacity: 0; transform: translateY(6px); transition: opacity .3s ease, transform .3s ease;
}
.captionLight.in { opacity: 1; transform: translateY(0); }

/* ---------- Scene 4 : style switching ---------- */
#s4 { background: linear-gradient(155deg, var(--paper-dim), var(--paper)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.s4shape { position: absolute; top: 8%; right: -12%; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(79,70,229,0.12), transparent 70%); }

/* A real cropped screenshot of the actual style-switch feature: the
   castle illustration, its Watercolor/3D/Ink/Anime variants, and the
   "Switch & Refine Magic Images" chat exchange, all baked into one
   authentic UI shot rather than recreated in CSS. */
.styleShot {
  width: 88%; border-radius: 14px; overflow: hidden;
  box-shadow: 0 16px 34px rgba(0,0,0,0.25);
  transform: scale(0.6); opacity: 0;
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
}
.styleShot.in { transform: scale(1); opacity: 1; }
.styleShot img { display: block; width: 100%; height: auto; }

.s4Headline { color: var(--ink); font-family: var(--font-display); font-size: 18px; font-weight: 800; text-align: center; padding: 0 26px; text-wrap: balance; line-height: 1.35; }
.s4Sub {
  color: var(--muted); font-family: var(--font-body); font-size: 12.5px; font-weight: 600; text-align: center; padding: 0 32px;
  opacity: 0; transition: opacity .35s ease;
}
.s4Sub.in { opacity: 1; }

/* ---------- Scene 5 : CTA ---------- */
#s5 {
  background: radial-gradient(90% 70% at 50% 35%, var(--paper-dim), var(--paper));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.logoGlow { position: absolute; width: 58%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(79,70,229,0.22), transparent 70%); }
.ring3 { position: absolute; width: 125%; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(79,70,229,0.06), transparent 50%); }

/* The real app icon, cropped from the site header. */
.appIcon {
  width: 46px; height: 46px; border-radius: 13px; overflow: hidden;
  box-shadow: 0 10px 22px rgba(79,70,229,0.35);
  opacity: 0; transform: scale(0.5);
  transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
}
.appIcon.in { opacity: 1; transform: scale(1); }
.appIcon img { display: block; width: 100%; height: 100%; object-fit: cover; }

.logo { position: relative; font-family: var(--font-display); font-size: 27px; font-weight: 800; color: var(--ink); white-space: nowrap; }
.logoLetter {
  display: inline-block; opacity: 0;
  transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg));
  transition: transform .38s cubic-bezier(.34,1.56,.64,1), opacity .22s ease;
}
.logoLetter.in { opacity: 1; transform: translate(0, 0) rotate(0deg); }
.logoLetter.accent { color: var(--brand); }

@keyframes logoImpactFlash {
  0%   { opacity: 0.35; transform: scale(0.8); }
  35%  { opacity: 1; transform: scale(1.25); }
  100% { opacity: 0.6; transform: scale(1); }
}
.logoGlow.impact { animation: drift 5s ease-in-out infinite, logoImpactFlash .3s ease; }

.tagline {
  font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; padding: 0 40px;
  opacity: 0; transform: translateY(6px); transition: opacity .3s ease, transform .3s ease;
}
.tagline.in { opacity: 1; transform: translateY(0); }
.tagline .accent { color: var(--brand); font-style: italic; font-weight: 700; }

.ctaPill {
  display: inline-flex; padding: 14px 30px; border-radius: 26px;
  background: linear-gradient(135deg, var(--brand), var(--brand-deep)); color: #fff;
  font-family: var(--font-display); font-size: 13.5px; font-weight: 800; position: relative; z-index: 2;
  opacity: 0; transform: translateY(10px);
  transition: opacity .35s ease, transform .35s ease;
}
.ctaPill.in { opacity: 1; transform: translateY(0); }

.trustLine {
  font-family: var(--font-body); font-size: 10.5px; font-weight: 700; color: #9691B8;
  opacity: 0; transition: opacity .3s ease;
}
.trustLine.in { opacity: 1; }

</style>
</head>

    <div id="grain"></div>

    <!-- Scene 1 — 0.0s-3.0s : the spark -->
    <div class="scene active" id="s1">
      <div class="s1shape s1shape-a drift"></div>

      <div class="sparkWrap">
        <div class="sparkRing" id="sparkRing"></div>
        <div class="sparkCore" id="sparkCore"></div>

      <div class="captionBottom">
        <div class="s1cap1" id="s1cap1"></div>
        <div class="s1cap2" id="s1cap2"></div>

    </div>

<script>

  totalDurationMs: 30000,

  copy: {

  // Spoken narration lines, one per scene, read aloud via the Web
  // Speech API (see speak() in main.js). Kept short so each fits
  // comfortably inside its scene at a natural speaking rate.

    s1: 'Your story is stuck in your head. Getting it into a real book used to take weeks.',
    s2: 'Just describe your vision, pick a style, and let the studio do the rest.',
    s3: 'A realistic flip-book engine brings every page to life, on any device.',
    s4: 'Don’t love the first result? Switch art styles in a single click.',
    s5: 'QuickAIBook. Turn your vision into beautiful AI books. Start creating free.',
  },

  // A C-major pentatonic scale. Any subset played together stays
  // consonant, so the audio engine can improvise a walking pattern
  // without ever sounding random/dissonant.
  musicScale: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00],

/**
 * A small canvas particle system: ambient drifting dust runs
 * continuously behind every scene; burst/converge are one-shot effects
 * for the scene 3 reveal. ambientDensity is adjustable live so a scene
 * can turn the background busier or calmer without swapping systems.
 */
class ParticleSystem {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particles = [];
    this.ambientDensity = 18;
    this.width = 0;
    this.height = 0;
    this._resize();
    window.addEventListener('resize', () => this._resize());
  }

  _resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.width = this.canvas.width = rect.width;
    this.height = this.canvas.height = rect.height;
  }

  spawnAmbient(count) {
    for (let i = 0; i < count; i++) {
      this.particles.push({
        x: Math.random() * this.width,
        y: Math.random() * this.height,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 1.4 + 0.5,
        a: Math.random() * 0.35 + 0.08,
        hue: '255,255,255',
      });
    }
  }

  spawnBurst(cx, cy, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3.2 + 1;
      this.particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: Math.random() * 2.5 + 1,
        a: 1,
        hue: '139,127,255',
        decay: 0.014,
      });
    }
  }

  spawnConverge(cx, cy, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 150 + 70;
      this.particles.push({
        x: cx + Math.cos(angle) * dist,
        y: cy + Math.sin(angle) * dist,
        tx: cx, ty: cy,
        r: Math.random() * 2 + 1,
        a: 0.9,
        hue: '255,255,255',
        converge: true,
        speed: 0.055 + Math.random() * 0.04,
      });
    }
  }

  clear() { this.particles = []; }

  tick() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.width, this.height);

    this.particles.forEach(p => {
      if (p.converge) {
        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;
      } else {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = this.width;  if (p.x > this.width)  p.x = 0;
        if (p.y < 0) p.y = this.height; if (p.y > this.height) p.y = 0;
        if (p.decay) p.a -= p.decay;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.hue},${Math.max(0, p.a)})`;
      ctx.fill();
    });

    this.particles = this.particles.filter(p => p.a > 0.02);
    if (this.particles.length < this.ambientDensity) this.spawnAmbient(1);
  }
}


/**
 * A scheduled music bed built on Web Audio's own clock, so it stays in
 * sync even if the tab is briefly backgrounded. Every note comes from
 * one pentatonic scale, a soft pad sits under every scene, a plucked
 * pattern walks the scale like a simple melody, and scene 3 gets a
 * rising sweep + chord stab at the visual climax.
 */
class AudioEngine {
  constructor(scale) {
    this.scale = scale;
    this.ctx = null;
    this.master = null;
  }

  init() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.5;
    this.master.connect(this.ctx.destination);
  }

  pluck(freq, startTime, dur, vol) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
    osc.connect(gain); gain.connect(this.master);
    osc.start(startTime); osc.stop(startTime + dur + 0.05);
  }

  pad(freqs, startTime, dur, vol) {
    freqs.forEach((f, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (idx - 1) * 6;
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(vol, startTime + dur * 0.25);
      gain.gain.linearRampToValueAtTime(vol * 0.7, startTime + dur * 0.7);
      gain.gain.linearRampToValueAtTime(0, startTime + dur);
      osc.connect(gain); gain.connect(this.master);
      osc.start(startTime); osc.stop(startTime + dur + 0.05);
    });
  }

  riseSweep(startTime, dur) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(200, startTime);
    filter.frequency.exponentialRampToValueAtTime(4000, startTime + dur);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, startTime);
    osc.frequency.exponentialRampToValueAtTime(260, startTime + dur);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.12, startTime + dur * 0.9);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
    osc.connect(filter); filter.connect(gain); gain.connect(this.master);
    osc.start(startTime); osc.stop(startTime + dur + 0.05);
  }

  chordStab(startTime) {
    [523.25, 659.25, 783.99, 1046.5].forEach(f => this.pluck(f, startTime, 0.6, 0.09));
  }

  scheduleFullTimeline() {
    const scale = this.scale;
    const t0 = this.ctx.currentTime + 0.05;

    // Scene 1 (0-3s): sparse, dim, unresolved
    this.pad([130.81, 155.56], t0, 3, 0.05);
    for (let i = 0; i < 6; i++) this.pluck(scale[0], t0 + i * 0.5, 0.15, 0.02);

    // Scene 2 (3-10s): brighter pad, walking pentatonic pulse builds energy
    this.pad([261.63, 329.63, 392.00], t0 + 3, 7, 0.06);
    for (let i = 0; i < 14; i++) this.pluck(scale[i % 5], t0 + 3 + i * 0.5, 0.3, 0.045);

    // Scene 3 (10-20s): the peak — sweep, stab, driving pattern
    this.riseSweep(t0 + 10, 1.4);
    this.chordStab(t0 + 11.4);
    this.pad([392.00, 523.25, 659.25], t0 + 11.4, 8.6, 0.07);
    for (let i = 0; i < 17; i++) this.pluck(scale[(i * 2) % scale.length], t0 + 11.9 + i * 0.5, 0.35, 0.05);

    // Scene 4 (20-27s): warm, playful, resolving
    this.pad([261.63, 329.63, 392.00], t0 + 20, 7, 0.055);
    for (let i = 0; i < 14; i++) this.pluck(scale[5 + (i % 4)], t0 + 20 + i * 0.5, 0.25, 0.04);

    // Scene 5 (27-30s): final resolving chord. The impact stab for the
    // logo shatter-assemble fires live, synced to the last letter's
    // lock time (see animateLogoShatter in main.js), so it can never
    // drift out of sync with the animation.
    this.pad([261.63, 329.63, 392.00, 523.25], t0 + 27, 3, 0.09);
  }
}


/**
 * A drift-free scheduler built on requestAnimationFrame. Every beat is
 * registered once with `.at(ms, fn)`; the engine walks real elapsed
 * time each frame and fires each beat exactly once.
 */
class Timeline {
  constructor(totalMs) {
    this.totalMs = totalMs;
    this.events = [];
    this.rafId = null;
    this.startTime = null;
  }

  at(ms, fn) {
    this.events.push({ ms, fn, fired: false });
    return this;
  }

  repeat(startMs, endMs, intervalMs, fn) {
    for (let t = startMs; t <= endMs; t += intervalMs) this.at(t, fn);
    return this;
  }

  stop() {
    if (this.rafId) cancelAnimationFrame(this.rafId);
    this.rafId = null;
  }

  start(onProgress) {
    this.stop();
    this.events.forEach(e => { e.fired = false; });
    this.startTime = performance.now();

    const loop = (now) => {
      const elapsed = now - this.startTime;
      for (const e of this.events) {
        if (!e.fired && elapsed >= e.ms) {
          e.fired = true;
          // Isolated so one broken beat logs an error instead of
          // throwing out of the rAF loop and freezing the entire ad
          // on whatever scene was showing when it happened.
          try { e.fn(elapsed); } catch (err) { console.error(`Timeline beat @${e.ms}ms failed:`, err); }
        }
      }
      if (onProgress) onProgress(Math.min(1, elapsed / this.totalMs));
      if (elapsed < this.totalMs) {
        this.rafId = requestAnimationFrame(loop);
      }
    };
    this.rafId = requestAnimationFrame(loop);
  }
}


/**
 * Wires config + particles + audio + timeline together and schedules
 * every visual beat. Gaps between tl.at() calls never exceed ~400ms in
 * scenes 2-3 or ~600ms elsewhere (content beats plus tl.repeat()
 * ambient fillers), so the ad is always mid-transition.
 */
(function () {
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function snapPulse(el) {
    if (!el) return;
    el.classList.remove('snap-pop');
    void el.offsetWidth;
    el.classList.add('snap-pop');
  }
  const on = (el) => { el.classList.add('in'); snapPulse(el); };
  const off = (el) => el.classList.remove('in');

  const canvas = $('fx');
  const particles = new ParticleSystem(canvas);
  const audio = new AudioEngine(AD_CONFIG.musicScale);

  // Spoken narration via the Web Speech API. Voices load asynchronously
  // in most browsers, so we pick one both immediately and again on
  // 'voiceschanged'; speak() itself no-ops cleanly wherever the API or
  // any voices are unavailable (e.g. headless browsers).
  const speechSupported = 'speechSynthesis' in window;
  let narratorVoice = null;
  function pickNarratorVoice() {
    const voices = window.speechSynthesis.getVoices();
    narratorVoice = voices.find(v => /en-US/i.test(v.lang) && /Google US English|Samantha|Female/i.test(v.name))
      || voices.find(v => v.lang && v.lang.startsWith('en'))
      || voices[0] || null;
  }
  if (speechSupported) {
    pickNarratorVoice();
    window.speechSynthesis.onvoiceschanged = pickNarratorVoice;
  }

  /** Speaks `text` aloud and ducks the music bed under it, restoring
   *  volume once the line finishes. */
  function speak(text) {
    if (!speechSupported) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.04;
    if (narratorVoice) utter.voice = narratorVoice;
    if (audio.ctx) {
      const gain = audio.master.gain;
      const t = audio.ctx.currentTime;
      gain.cancelScheduledValues(t);
      gain.linearRampToValueAtTime(0.2, t + 0.15);
      utter.onend = () => {
        const t2 = audio.ctx.currentTime;
        gain.cancelScheduledValues(t2);
        gain.linearRampToValueAtTime(0.5, t2 + 0.3);
      };
    }
    window.speechSynthesis.speak(utter);
  }

  const els = {
    stage: $('stage'),
    scenes: ['s1', 's2', 's3', 's4', 's5'].map($),
    sparkCore: $('sparkCore'), sparkRing: $('sparkRing'),
    s1cap1: $('s1cap1'), s1cap2: $('s1cap2'),
    studioBadge: $('studioBadge'), modeMagic: $('modeMagic'), workShot: $('workShot'),
    glowOrb: $('glowOrb'), flipShot: $('flipShot'),
    s3text: $('s3text'),
    styleShot: $('styleShot'),
    s4headline: $('s4headline'), s4sub: $('s4sub'),
    appIcon: $('appIcon'), logo: $('logo'), logoGlow: $('logoGlow'), logoLetters: [], tagline: $('tagline'), ctaPill: $('ctaPill'), trustLine: $('trustLine'),
    progress: $('progress'),
    playOverlay: $('playOverlay'),
    replayBtn: $('replayBtn'),
  };

  function showScene(id) {
    els.scenes.forEach(s => s.classList.toggle('active', s.id === id));
  }

  /** 60-80ms hard flash/offset on the whole stage — a percussive "glitch
   *  cut" for the strongest beats in scene 3. */
  function glitchCut(durationMs = 70) {
    if (reduceMotion) return;
    const dx = (Math.random() * 3 + 2) * (Math.random() < 0.5 ? -1 : 1);
    const dy = (Math.random() * 3 + 2) * (Math.random() < 0.5 ? -1 : 1);
    els.stage.style.transition = 'none';
    els.stage.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
    els.stage.style.filter = 'brightness(1.7)';
    setTimeout(() => {
      els.stage.style.transform = '';
      els.stage.style.filter = '';
    }, durationMs);
  }

  /** Rebuilds #logo as one <span class="logoLetter"> per character, each
   *  starting flung outward as a shard. animateLogoShatter() flies them
   *  home, ending in an impact flash + chord stab on the last letter. */
  function buildLogoLetters() {
    const cfg = AD_CONFIG.copy.logo;
    const chars = (cfg.prefix + cfg.accent + cfg.suffix).split('');
    const accentStart = cfg.prefix.length;
    const accentEnd = accentStart + cfg.accent.length;
    els.logo.innerHTML = '';
    els.logoLetters = chars.map((ch, i) => {
      const span = document.createElement('span');
      span.className = 'logoLetter' + (i >= accentStart && i < accentEnd ? ' accent' : '');
      span.textContent = ch;
      const dx = (40 + Math.random() * 40) * (Math.random() < 0.5 ? -1 : 1);
      const dy = (40 + Math.random() * 40) * (Math.random() < 0.5 ? -1 : 1);
      const rot = (45 + Math.random() * 45) * (Math.random() < 0.5 ? -1 : 1);
      span.style.setProperty('--dx', dx.toFixed(0) + 'px');
      span.style.setProperty('--dy', dy.toFixed(0) + 'px');
      span.style.setProperty('--rot', rot.toFixed(0) + 'deg');
      els.logo.appendChild(span);
      return span;
    });
  }

  function animateLogoShatter() {
    const stagger = 30;
    const settleMs = 380; // matches .logoLetter's transition duration
    els.logoLetters.forEach((letter, i) => {
      setTimeout(() => on(letter), i * stagger);
    });
    setTimeout(() => {
      els.logoGlow.classList.remove('impact');
      void els.logoGlow.offsetWidth;
      els.logoGlow.classList.add('impact');
      if (audio.ctx) audio.chordStab(audio.ctx.currentTime + 0.02);
    }, (els.logoLetters.length - 1) * stagger + settleMs);
  }

  function resetAll() {
    if (speechSupported) window.speechSynthesis.cancel();
    els.stage.style.transform = ''; els.stage.style.filter = '';
    els.progress.style.width = '0%';
    showScene('s1');
    off(els.sparkCore); off(els.sparkRing);
    els.s1cap1.textContent = ''; els.s1cap2.innerHTML = '';
    off(els.studioBadge); off(els.modeMagic); off(els.workShot);
    off(els.glowOrb); off(els.flipShot);
    els.s3text.textContent = ''; off(els.s3text);
    off(els.styleShot);
    off(els.s4headline); off(els.s4sub);
    els.logoGlow.classList.remove('impact');
    buildLogoLetters();
    off(els.appIcon); off(els.tagline); off(els.ctaPill); off(els.trustLine);
  }

  function buildTimeline() {
    const tl = new Timeline(AD_CONFIG.totalDurationMs);
    const cx = () => particles.width / 2;
    const cy = () => particles.height / 2;

    // ---------- Scene 1 (0.0s - 3.0s) — the spark ----------
    tl.at(0,    () => { showScene('s1'); particles.ambientDensity = 14; speak(AD_CONFIG.voice.s1); });
    tl.at(150,  () => { on(els.sparkRing); });
    tl.at(300,  () => { on(els.sparkCore); });
    tl.at(650,  () => { els.s1cap1.textContent = AD_CONFIG.copy.s1cap1; });
    tl.at(1300, () => { els.s1cap2.innerHTML = AD_CONFIG.copy.s1cap2; });
    tl.at(1900, () => { snapPulse(els.sparkCore); particles.spawnAmbient(4); });
    tl.repeat(1050, 2900, 400, () => { particles.spawnAmbient(3); });

    // ---------- Scene 2 (3.0s - 10.0s) — the studio workspace ----------
    tl.at(3000, () => { showScene('s2'); particles.ambientDensity = 22; particles.spawnAmbient(10); on(els.studioBadge); on(els.workShot); speak(AD_CONFIG.voice.s2); });
    tl.at(3400, () => { on(els.modeMagic); });
    tl.at(4200, () => { snapPulse(els.workShot); });
    tl.at(5000, () => { particles.spawnAmbient(6); });
    tl.at(5800, () => { snapPulse(els.modeMagic); });
    tl.at(6600, () => { particles.spawnBurst(cx(), cy(), 12); });
    tl.at(7400, () => { snapPulse(els.workShot); });
    tl.at(8200, () => { snapPulse(els.modeMagic); particles.spawnAmbient(6); });
    tl.at(9000, () => { particles.spawnAmbient(6); });
    tl.repeat(3700, 9900, 360, () => { particles.spawnAmbient(3); });

    // ---------- Scene 3 (10.0s - 20.0s) — the flipbook reveal ----------
    tl.at(10000, () => {
      showScene('s3');
      speak(AD_CONFIG.voice.s3);
      particles.ambientDensity = 6;
      particles.clear();
      particles.spawnConverge(cx(), cy(), 65);
    });
    tl.at(10600, () => { on(els.glowOrb); });
    // GLITCH CUT #1 — the flipbook reveal, the biggest hit in the ad
    tl.at(11400, () => {
      particles.clear();
      particles.spawnBurst(cx(), cy(), 80);
      on(els.flipShot);
      off(els.glowOrb);
      particles.ambientDensity = 22;
      glitchCut(80);
    });
    tl.at(12600, () => { els.s3text.textContent = AD_CONFIG.copy.s3; on(els.s3text); });
    tl.at(14000, () => { snapPulse(els.flipShot); });
    // GLITCH CUT #2 — mid-climax punctuation
    tl.at(15200, () => { glitchCut(70); particles.spawnBurst(cx(), cy(), 20); });
    tl.at(16000, () => { particles.spawnAmbient(6); snapPulse(els.flipShot); });
    tl.at(18000, () => { particles.spawnAmbient(6); });
    // GLITCH CUT #3 — final punch before the transformation resolves
    tl.at(18400, () => { glitchCut(75); particles.spawnBurst(cx(), cy(), 15); });
    tl.repeat(10150, 19900, 350, () => {
      particles.spawnAmbient(2);
      if (Math.random() < 0.4) snapPulse(els.flipShot);
    });

    // ---------- Scene 4 (20.0s - 27.0s) — style switching ----------
    tl.at(20000, () => { showScene('s4'); particles.ambientDensity = 14; on(els.styleShot); on(els.s4headline); speak(AD_CONFIG.voice.s4); });
    tl.at(20350, () => { on(els.s4sub); });
    tl.at(21200, () => { snapPulse(els.styleShot); });
    tl.at(22200, () => { particles.spawnBurst(cx(), cy(), 10); });
    tl.at(23300, () => { snapPulse(els.styleShot); });
    tl.at(24600, () => { snapPulse(els.s4headline); particles.spawnAmbient(6); });
    tl.at(25550, () => { snapPulse(els.styleShot); });
    tl.repeat(20950, 26900, 480, () => {
      particles.spawnAmbient(3);
      if (Math.random() < 0.4) snapPulse(els.styleShot);
    });

    // ---------- Scene 5 (27.0s - 30.0s) — CTA & the shatter-assemble logo ----------
    tl.at(27000, () => { showScene('s5'); particles.ambientDensity = 12; on(els.appIcon); animateLogoShatter(); speak(AD_CONFIG.voice.s5); });
    tl.at(27650, () => { particles.spawnBurst(cx(), cy(), 20); }); // sparkle just ahead of the impact lock
    tl.at(28000, () => { on(els.tagline); });
    tl.at(28300, () => { on(els.ctaPill); });
    tl.at(28650, () => { snapPulse(els.ctaPill); on(els.trustLine); });
    tl.repeat(27300, 29900, 480, () => { particles.spawnAmbient(3); });

    return tl;
  }

  let timeline = null;

  function startShow() {
    resetAll();
    particles.clear();
    if (audio.ctx) audio.scheduleFullTimeline();
    timeline = buildTimeline();
    timeline.start((fraction) => { els.progress.style.width = (fraction * 100).toFixed(1) + '%'; });
  }

  (function particleLoop() {
    particles.tick();
    requestAnimationFrame(particleLoop);
  })();

  els.playOverlay.addEventListener('click', function () {
    if (!audio.ctx) audio.init();
    this.style.display = 'none';
    particles._resize();
    startShow();
  });

  els.replayBtn.addEventListener('click', startShow);
})();

</script>
</body>
</html>
